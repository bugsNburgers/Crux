<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none">
  <!-- X with extended bottom-right leg -->
  <!-- Left-top to right-bottom stroke -->
  <line x1="8" y1="8" x2="92" y2="92" stroke="#00e5ff" stroke-width="9" stroke-linecap="square"/>
  <!-- Right-top to left-bottom stroke (ends at midpoint level) -->
  <line x1="92" y1="8" x2="8" y2="92" stroke="#00e5ff" stroke-width="9" stroke-linecap="square"/>
  <!-- Extended bottom-right leg going further down and right -->
  <line x1="65" y1="65" x2="100" y2="118" stroke="#00e5ff" stroke-width="9" stroke-linecap="square"/>
</svg>
